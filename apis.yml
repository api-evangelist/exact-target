name: Exact Target
description: 'ExactTarget was a digital marketing and email-marketing automation SaaS company founded in
  2000 in Indianapolis, Indiana. It built the Fuel developer platform and Interactive Marketing Hub for
  email, mobile, and social campaign automation, went public on the NYSE (ticker ET) in March 2012, and
  was acquired by Salesforce in December 2013 for approximately 2.5 billion dollars. ExactTarget became
  the foundation of Salesforce Marketing Cloud; the exacttarget.com domain now redirects to the Salesforce
  Marketing Cloud email-marketing product and the former developer.exacttarget.com Fuel/Code@ API platform
  (REST and SOAP APIs) has been retired and folded into the Salesforce Marketing Cloud developer surface.
  This profile is retained in the API Evangelist network as a historical/acquired-company record.'
